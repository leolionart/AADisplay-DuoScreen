name: Build APK & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (signed release or local smoke artifact)
        env:
          RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PallowDebugReleaseSigning=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            apk_path=app/build/outputs/apk/release/app-release.apk
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Tagged releases require configured release signing secrets."
            exit 1
          else
            apk_path=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            cp "$apk_path" "release-artifacts/DuoScreen-AA-${{ github.ref_name }}.apk"
          else
            cp "$apk_path" release-artifacts/DuoScreen-AA-latest.apk
          fi
          echo "Unsigned APKs require signing before production installation; configure release secrets for signed artifacts."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoScreen-AA-APK
          path: release-artifacts/*.apk
          retention-days: 14

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('DuoScreen AA {0}', github.ref_name) || 'DuoScreen AA (Latest Auto-Build)' }}
          body: |
            ## 🚀 DuoScreen AA - Bản dựng tự động từ nhánh `main`

            - **Tải file APK trực tiếp**: Bấm vào file `.apk` trong mục **Assets** bên dưới để tải về và cài đặt trên điện thoại.
            - **Hỗ trợ**: Yêu cầu quyền **Shizuku** (Wireless ADB) để điều khiển màn hình và ứng dụng.
            - **Tính năng nổi bật**:
              - ⚡ **Mode Nhẹ (Khuyên dùng)**: 1 Bản đồ dẫn đường lớn + 2 Widget native (Đồng hồ tốc độ & cảnh báo Vietmap Live, Trình điều khiển nhạc tiện lợi).
              - 🚀 **Mode 3**: Đa nhiệm 3 ứng dụng song song trên 3 màn hình ảo độc lập.
              - 🚗 Tích hợp hiển thị giao diện trên Android Auto (`DuoMainScreen`).
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: release-artifacts/*.apk
